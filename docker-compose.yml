version: '3.8'

# Local development stack — runs MySQL, the Node.js backend, and an nginx
# server that serves the frontend and proxies /api calls to the backend.
#
# Usage:
#   docker-compose up --build        # first run
#   docker-compose up                # subsequent runs
#   docker-compose down -v           # stop and remove database volume
#
# Access:
#   Frontend  →  http://localhost
#   API       →  http://localhost/api/health
#   API       →  http://localhost/api/visitors

services:

  # ── MySQL 8 ────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE:      sampledb
      MYSQL_USER:          appuser
      MYSQL_PASSWORD:      apppassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "appuser", "-papppassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Node.js backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST:     db
      DB_USER:     appuser
      DB_PASSWORD: apppassword
      DB_NAME:     sampledb
      DB_PORT:     3306
      PORT:        3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # ── nginx — serves frontend and proxies /api to backend ───────────────────
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html-src:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # Copies frontend files into the writable nginx html dir, then replaces
    # the backend URL placeholder so the page works against the local backend.
    entrypoint: >
      sh -c "
        cp -r /usr/share/nginx/html-src/. /usr/share/nginx/html/ &&
        sed -i 's|REPLACE_WITH_BACKEND_API_URL||g' /usr/share/nginx/html/app.js &&
        nginx -g 'daemon off;'
      "
    depends_on:
      - backend

volumes:
  db_data:
