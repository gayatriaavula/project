# ── SonarCloud project identity ───────────────────────────────────────────────
# These values must match what is configured in your SonarCloud organisation.
# Go to sonarcloud.io → My Account → Organisations to confirm the organisation key.
sonar.projectKey=gayatriaavula_project
sonar.organization=gayatriaavula
sonar.projectName=sample-app
sonar.projectVersion=1.0

# ── Sources ───────────────────────────────────────────────────────────────────
sonar.sources=backend
sonar.tests=backend/tests

# Exclude generated / third-party code from analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/coverage/**,\
  terraform/**,\
  frontend/**

sonar.test.inclusions=backend/tests/**/*.test.js

# ── Encoding ──────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
