# ── SonarCloud project identity ───────────────────────────────────────────────
# Must match exactly what is in your SonarCloud organisation.
# Login at sonarcloud.io → your org → Projects to confirm these values.
sonar.projectKey=gayatriaavula_project
sonar.organization=gayatriaavula
sonar.projectName=sample-app
sonar.projectVersion=1.0

# ── Sources ───────────────────────────────────────────────────────────────────
# Scan backend (Node.js/Express API) and frontend (plain JS).
sonar.sources=backend,frontend
sonar.tests=backend/tests

# Exclude dependencies, generated files, infrastructure code, and CSS/HTML
# (SonarCloud focuses on JS logic — CSS and HTML have no quality rules here).
sonar.exclusions=\
  **/node_modules/**,\
  **/coverage/**,\
  **/package-lock.json,\
  terraform/**,\
  frontend/styles.css,\
  frontend/index.html

sonar.test.inclusions=backend/tests/**/*.test.js

# ── Language settings ─────────────────────────────────────────────────────────
sonar.javascript.environments=browser,node

# ── Coverage ──────────────────────────────────────────────────────────────────
# LCOV report generated by: cd backend && npm run test:coverage
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# ── Quality Gate ──────────────────────────────────────────────────────────────
# Block the CI step until the quality gate result is available.
sonar.qualitygate.wait=true

# ── Encoding ──────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
