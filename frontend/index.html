<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample Frontend</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Sample Application</h1>
    <p>This static frontend is deployed to S3 and connects to a backend API.</p>

    <div class="panel">
      <strong>Backend endpoint:</strong>
      <pre id="backend-url">REPLACE_WITH_BACKEND_API_URL</pre>
    </div>

    <div class="section">
      <h2>Backend Health Check</h2>
      <button id="health-check">Check Health</button>
      <pre id="health-output"></pre>
    </div>

    <div class="section">
      <h2>Visitor Tracking</h2>
      <p>Each time you visit this page, a record is added to the database.</p>
      <button id="load-visitors">Load Recent Visitors</button>
      <pre id="visitors-output"></pre>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
