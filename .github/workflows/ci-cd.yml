name: AWS Sample App CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Syntax check
        working-directory: backend
        run: node --check server.js

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: test
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    outputs:
      ecr_url: ${{ steps.tf_outputs.outputs.ecr_url }}
      ecs_cluster: ${{ steps.tf_outputs.outputs.ecs_cluster }}
      ecs_service: ${{ steps.tf_outputs.outputs.ecs_service }}
      backend_url: ${{ steps.tf_outputs.outputs.backend_url }}
      frontend_bucket: ${{ steps.tf_outputs.outputs.frontend_bucket }}
      frontend_url: ${{ steps.tf_outputs.outputs.frontend_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=app/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Force unlock stale state lock
        continue-on-error: true
        env:
          BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          aws s3 rm "s3://${BUCKET}/app/terraform.tfstate.tflock" || echo "No lock file found"

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: terraform
        run: terraform plan -out=tfplan -no-color -lock=false

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        working-directory: terraform
        run: terraform show -no-color tfplan > plan.txt
        continue-on-error: true

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('terraform/plan.txt')) process.exit(0);
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(-60000) : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`\n${truncated}\n\`\`\``
            });

      - name: Terraform apply
        if: success() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        working-directory: terraform
        run: terraform apply -auto-approve -lock=false tfplan

      - name: Capture terraform outputs
        id: tf_outputs
        if: success() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        working-directory: terraform
        run: |
          echo "ecr_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT
          echo "ecs_cluster=$(terraform output -raw ecs_cluster_name)" >> $GITHUB_OUTPUT
          echo "ecs_service=$(terraform output -raw ecs_service_name)" >> $GITHUB_OUTPUT
          echo "backend_url=$(terraform output -raw backend_url)" >> $GITHUB_OUTPUT
          echo "frontend_bucket=$(terraform output -raw frontend_bucket_name)" >> $GITHUB_OUTPUT
          echo "frontend_url=$(terraform output -raw frontend_url)" >> $GITHUB_OUTPUT

  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve deployment variables
        id: vars
        env:
          TF_ECR_URL: ${{ needs.terraform.outputs.ecr_url }}
          TF_ECS_CLUSTER: ${{ needs.terraform.outputs.ecs_cluster }}
          TF_ECS_SERVICE: ${{ needs.terraform.outputs.ecs_service }}
          TF_BACKEND_URL: ${{ needs.terraform.outputs.backend_url }}
          TF_FRONTEND_BUCKET: ${{ needs.terraform.outputs.frontend_bucket }}
          TF_FRONTEND_URL: ${{ needs.terraform.outputs.frontend_url }}
        run: |
          ECR_URL=${TF_ECR_URL:-$(aws ecr describe-repositories --repository-names sample-app-backend --query 'repositories[0].repositoryUri' --output text)}
          ECS_CLUSTER=${TF_ECS_CLUSTER:-$(aws ecs list-clusters --query 'clusterArns[0]' --output text | xargs aws ecs describe-clusters --clusters --query 'clusters[0].clusterName' --output text)}
          ECS_SERVICE=${TF_ECS_SERVICE:-$(aws ecs list-services --cluster $ECS_CLUSTER --query 'serviceArns[0]' --output text | xargs -I{} aws ecs describe-services --cluster $ECS_CLUSTER --services {} --query 'services[0].serviceName' --output text)}
          BACKEND_URL=${TF_BACKEND_URL:-$(aws elbv2 describe-load-balancers --names sample-app-alb --query 'LoadBalancers[0].DNSName' --output text)}
          FRONTEND_BUCKET=${TF_FRONTEND_BUCKET:-$(aws s3api list-buckets --query 'Buckets[?contains(Name,`frontend`)].Name' --output text | awk '{print $1}')}
          FRONTEND_URL=${TF_FRONTEND_URL:-"http://${FRONTEND_BUCKET}.s3-website-${AWS_REGION}.amazonaws.com"}
          echo "ecr_url=$ECR_URL" >> $GITHUB_OUTPUT
          echo "ecs_cluster=$ECS_CLUSTER" >> $GITHUB_OUTPUT
          echo "ecs_service=$ECS_SERVICE" >> $GITHUB_OUTPUT
          echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "frontend_bucket=$FRONTEND_BUCKET" >> $GITHUB_OUTPUT
          echo "frontend_url=$FRONTEND_URL" >> $GITHUB_OUTPUT
          echo "--- Resolved values ---"
          echo "ECR:     $ECR_URL"
          echo "Cluster: $ECS_CLUSTER"
          echo "Service: $ECS_SERVICE"
          echo "Backend: $BACKEND_URL"
          echo "Bucket:  $FRONTEND_BUCKET"

      - name: Build and push backend image
        env:
          ECR_URL: ${{ steps.vars.outputs.ecr_url }}
        run: |
          ECR_REGISTRY=$(echo $ECR_URL | cut -d'/' -f1)
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
          docker build -t sample-backend ./backend
          docker tag sample-backend:latest $ECR_URL:latest
          docker push $ECR_URL:latest

      - name: Force ECS deployment and wait
        env:
          ECS_CLUSTER: ${{ steps.vars.outputs.ecs_cluster }}
          ECS_SERVICE: ${{ steps.vars.outputs.ecs_service }}
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --force-new-deployment
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE

      - name: Deploy frontend to S3
        env:
          BACKEND_URL: ${{ steps.vars.outputs.backend_url }}
          FRONTEND_BUCKET: ${{ steps.vars.outputs.frontend_bucket }}
        run: |
          sed -i "s|REPLACE_WITH_BACKEND_API_URL|http://$BACKEND_URL|g" frontend/app.js
          aws s3 sync ./frontend s3://$FRONTEND_BUCKET --delete

      - name: Deployment summary
        env:
          FRONTEND_URL: ${{ steps.vars.outputs.frontend_url }}
          BACKEND_URL: ${{ steps.vars.outputs.backend_url }}
        run: |
          echo "================================"
          echo "Deployment complete!"
          echo "Frontend: $FRONTEND_URL"
          echo "Backend:  http://$BACKEND_URL"
          echo "================================"
