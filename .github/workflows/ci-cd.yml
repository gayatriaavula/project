name: AWS Sample App CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Syntax check
        working-directory: backend
        run: node --check server.js

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: test
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    outputs:
      ecr_url: ${{ steps.tf_outputs.outputs.ecr_url }}
      ecs_cluster: ${{ steps.tf_outputs.outputs.ecs_cluster }}
      ecs_service: ${{ steps.tf_outputs.outputs.ecs_service }}
      backend_url: ${{ steps.tf_outputs.outputs.backend_url }}
      frontend_bucket: ${{ steps.tf_outputs.outputs.frontend_bucket }}
      frontend_url: ${{ steps.tf_outputs.outputs.frontend_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=app/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-state-lock" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: terraform
        shell: bash
        run: |
          set -o pipefail
          terraform plan -out=tfplan -no-color 2>&1 | tee plan.txt

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(-60000) : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`\n${truncated}\n\`\`\``
            });

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Capture terraform outputs
        id: tf_outputs
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        working-directory: terraform
        run: |
          echo "ecr_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT
          echo "ecs_cluster=$(terraform output -raw ecs_cluster_name)" >> $GITHUB_OUTPUT
          echo "ecs_service=$(terraform output -raw ecs_service_name)" >> $GITHUB_OUTPUT
          echo "backend_url=$(terraform output -raw backend_url)" >> $GITHUB_OUTPUT
          echo "frontend_bucket=$(terraform output -raw frontend_bucket_name)" >> $GITHUB_OUTPUT
          echo "frontend_url=$(terraform output -raw frontend_url)" >> $GITHUB_OUTPUT

  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build and push backend image
        env:
          ECR_URL: ${{ needs.terraform.outputs.ecr_url }}
        run: |
          ECR_REGISTRY=$(echo $ECR_URL | cut -d'/' -f1)
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
          docker build -t sample-backend ./backend
          docker tag sample-backend:latest $ECR_URL:latest
          docker push $ECR_URL:latest

      - name: Force ECS deployment and wait
        env:
          ECS_CLUSTER: ${{ needs.terraform.outputs.ecs_cluster }}
          ECS_SERVICE: ${{ needs.terraform.outputs.ecs_service }}
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --force-new-deployment
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE

      - name: Deploy frontend to S3
        env:
          BACKEND_URL: ${{ needs.terraform.outputs.backend_url }}
          FRONTEND_BUCKET: ${{ needs.terraform.outputs.frontend_bucket }}
        run: |
          sed -i "s|REPLACE_WITH_BACKEND_API_URL|http://$BACKEND_URL|g" frontend/app.js
          aws s3 sync ./frontend s3://$FRONTEND_BUCKET --delete

      - name: Deployment summary
        env:
          FRONTEND_URL: ${{ needs.terraform.outputs.frontend_url }}
          BACKEND_URL: ${{ needs.terraform.outputs.backend_url }}
        run: |
          echo "Deployment complete!"
          echo "Frontend: $FRONTEND_URL"
          echo "Backend:  http://$BACKEND_URL"
