name: Deploy — Production

# Triggered when code is merged into main, or via manual workflow_dispatch.
# Pipeline: lint → test + security + plan → approve → deploy
# Security is a HARD GATE — no approval prompt appears until all scans pass.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        type: string

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  ENVIRONMENT:       prod
  TF_DIR:            terraform/environments/prod
  AWS_REGION:        ${{ secrets.AWS_REGION }}
  TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Run ESLint
        working-directory: backend
        run: npm run lint

  # ── Test ──────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Syntax check
        working-directory: backend
        run: node --check server.js
      - name: Run tests
        working-directory: backend
        run: npm test

  # ── Security — Trivy + SonarCloud ─────────────────────────────────────────
  # Reusable workflow. Approval and deploy cannot start until all four scans pass.
  security:
    name: Security Scans
    needs: lint
    uses: ./.github/workflows/_security.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: read

  # ── Terraform plan ────────────────────────────────────────────────────────
  plan:
    name: Terraform Plan (prod)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="encrypt=true"
      - name: Clear stale state lock
        continue-on-error: true
        run: |
          aws s3 rm "s3://${{ secrets.TF_STATE_BUCKET }}/prod/terraform.tfstate.tflock" || true
      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate
      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -no-color -lock=false -out=tfplan
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 1

  # ── Manual approval gate ──────────────────────────────────────────────────
  # This job only runs AFTER test + security + plan all succeed.
  # On workflow_dispatch: requires the caller to type "deploy".
  # On push to main: auto-approved (PR review already acted as gate).
  approve:
    name: Manual Approval
    runs-on: ubuntu-latest
    needs: [test, security, plan]
    steps:
      - name: Verify confirmation (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "ERROR: Type 'deploy' in the confirmation field to proceed."
            exit 1
          fi
          echo "Approved by ${{ github.actor }}. Deploying to production..."

      - name: Auto-approved (push to main after PR merge)
        if: github.event_name == 'push'
        run: echo "Push to main by ${{ github.actor }}. Proceeding to prod deploy."

  # ── Deploy to production ──────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: approve
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="encrypt=true"
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: ${{ env.TF_DIR }}
      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -lock=false tfplan

      - name: Capture terraform outputs
        id: tf_outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "ecr_url=$(terraform output -raw ecr_repository_url)"           >> $GITHUB_OUTPUT
          echo "ecs_cluster=$(terraform output -raw ecs_cluster_name)"         >> $GITHUB_OUTPUT
          echo "ecs_service=$(terraform output -raw ecs_service_name)"         >> $GITHUB_OUTPUT
          echo "backend_url=$(terraform output -raw backend_url)"              >> $GITHUB_OUTPUT
          echo "frontend_bucket=$(terraform output -raw frontend_bucket_name)" >> $GITHUB_OUTPUT
          echo "frontend_url=$(terraform output -raw frontend_url)"            >> $GITHUB_OUTPUT

      - name: Resolve deployment variables
        id: vars
        env:
          TF_ECR_URL:         ${{ steps.tf_outputs.outputs.ecr_url }}
          TF_ECS_CLUSTER:     ${{ steps.tf_outputs.outputs.ecs_cluster }}
          TF_ECS_SERVICE:     ${{ steps.tf_outputs.outputs.ecs_service }}
          TF_BACKEND_URL:     ${{ steps.tf_outputs.outputs.backend_url }}
          TF_FRONTEND_BUCKET: ${{ steps.tf_outputs.outputs.frontend_bucket }}
          TF_FRONTEND_URL:    ${{ steps.tf_outputs.outputs.frontend_url }}
        run: |
          ECR_URL=${TF_ECR_URL:-$(aws ecr describe-repositories \
            --repository-names sample-app-prod-backend \
            --query 'repositories[0].repositoryUri' --output text)}
          ECS_CLUSTER=${TF_ECS_CLUSTER:-sample-app-prod-cluster}
          ECS_SERVICE=${TF_ECS_SERVICE:-sample-app-prod-backend-service}
          BACKEND_URL=${TF_BACKEND_URL:-$(aws elbv2 describe-load-balancers \
            --names sample-app-prod-alb \
            --query 'LoadBalancers[0].DNSName' --output text)}
          FRONTEND_BUCKET=${TF_FRONTEND_BUCKET:-$(aws s3api list-buckets \
            --query 'Buckets[?contains(Name,`sample-app-prod-frontend`)].Name' \
            --output text | awk '{print $1}')}
          FRONTEND_URL=${TF_FRONTEND_URL:-"http://${FRONTEND_BUCKET}.s3-website-${AWS_REGION}.amazonaws.com"}
          echo "ecr_url=$ECR_URL"                >> $GITHUB_OUTPUT
          echo "ecs_cluster=$ECS_CLUSTER"         >> $GITHUB_OUTPUT
          echo "ecs_service=$ECS_SERVICE"         >> $GITHUB_OUTPUT
          echo "backend_url=$BACKEND_URL"         >> $GITHUB_OUTPUT
          echo "frontend_bucket=$FRONTEND_BUCKET" >> $GITHUB_OUTPUT
          echo "frontend_url=$FRONTEND_URL"       >> $GITHUB_OUTPUT

      - name: Build and push backend image
        env:
          ECR_URL: ${{ steps.vars.outputs.ecr_url }}
        run: |
          ECR_REGISTRY=$(echo "$ECR_URL" | cut -d'/' -f1)
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker build -t sample-backend ./backend
          docker tag sample-backend:latest "$ECR_URL:latest"
          docker push "$ECR_URL:latest"

      - name: Force ECS deployment and wait
        env:
          ECS_CLUSTER: ${{ steps.vars.outputs.ecs_cluster }}
          ECS_SERVICE:  ${{ steps.vars.outputs.ecs_service }}
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --force-new-deployment
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Deploy frontend to S3
        env:
          BACKEND_URL:     ${{ steps.vars.outputs.backend_url }}
          FRONTEND_BUCKET: ${{ steps.vars.outputs.frontend_bucket }}
        run: |
          sed -i "s|REPLACE_WITH_BACKEND_API_URL|http://$BACKEND_URL|g" frontend/app.js
          aws s3 sync ./frontend "s3://$FRONTEND_BUCKET" --delete

      - name: Deployment summary
        env:
          FRONTEND_URL: ${{ steps.vars.outputs.frontend_url }}
          BACKEND_URL:  ${{ steps.vars.outputs.backend_url }}
        run: |
          echo "================================"
          echo "Production deployment complete!"
          echo "Frontend: $FRONTEND_URL"
          echo "Backend:  http://$BACKEND_URL"
          echo "================================"
