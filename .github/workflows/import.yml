name: Import Existing AWS Resources into Terraform State

# Imports pre-existing AWS resources into the chosen environment's Terraform state.
# Run this once after manually creating resources, or after a state loss.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to import into (dev | staging | prod)'
        required: true
        type: choice
        options: [dev, staging, prod]
        default: prod

jobs:
  import:
    name: Import (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
      TF_DIR:      terraform/environments/${{ github.event.inputs.environment }}
      AWS_REGION:  ${{ secrets.AWS_REGION }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Resolve VPC CIDR for environment
        id: cidr
        run: |
          case "${{ env.ENVIRONMENT }}" in
            prod)    echo "vpc_cidr=10.2.0.0/16"  >> $GITHUB_OUTPUT
                     echo "pub0=10.2.0.0/24"       >> $GITHUB_OUTPUT
                     echo "pub1=10.2.1.0/24"       >> $GITHUB_OUTPUT
                     echo "priv0=10.2.10.0/24"     >> $GITHUB_OUTPUT
                     echo "priv1=10.2.11.0/24"     >> $GITHUB_OUTPUT ;;
            staging) echo "vpc_cidr=10.1.0.0/16"  >> $GITHUB_OUTPUT
                     echo "pub0=10.1.0.0/24"       >> $GITHUB_OUTPUT
                     echo "pub1=10.1.1.0/24"       >> $GITHUB_OUTPUT
                     echo "priv0=10.1.10.0/24"     >> $GITHUB_OUTPUT
                     echo "priv1=10.1.11.0/24"     >> $GITHUB_OUTPUT ;;
            *)       echo "vpc_cidr=10.0.0.0/16"  >> $GITHUB_OUTPUT
                     echo "pub0=10.0.0.0/24"       >> $GITHUB_OUTPUT
                     echo "pub1=10.0.1.0/24"       >> $GITHUB_OUTPUT
                     echo "priv0=10.0.10.0/24"     >> $GITHUB_OUTPUT
                     echo "priv1=10.0.11.0/24"     >> $GITHUB_OUTPUT ;;
          esac

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Clear stale lock
        continue-on-error: true
        run: |
          aws s3 rm "s3://${{ secrets.TF_STATE_BUCKET }}/${{ env.ENVIRONMENT }}/terraform.tfstate.tflock" || true

      # ── Fix: delete target group with wrong target_type ──────────────────
      - name: Delete wrong target group if target_type=instance
        continue-on-error: true
        run: |
          TG="sample-app-${{ env.ENVIRONMENT }}-backend-tg"
          TG_ARN=$(aws elbv2 describe-target-groups --names $TG \
            --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null)
          if [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ]; then
            for ALB in $(aws elbv2 describe-load-balancers \
              --query 'LoadBalancers[].LoadBalancerArn' --output text); do
              for L in $(aws elbv2 describe-listeners --load-balancer-arn $ALB \
                --query 'Listeners[].ListenerArn' --output text); do
                aws elbv2 delete-listener --listener-arn $L && echo "Deleted listener $L"
              done
            done
            sleep 5
            aws elbv2 delete-target-group --target-group-arn $TG_ARN
          fi

      # ── Release unused EIPs ──────────────────────────────────────────────
      - name: Release unassociated Elastic IPs
        continue-on-error: true
        run: |
          for ALLOC in $(aws ec2 describe-addresses \
            --query 'Addresses[?AssociationId==null].AllocationId' --output text); do
            aws ec2 release-address --allocation-id $ALLOC && echo "Released EIP: $ALLOC"
          done

      # ── Import VPC ───────────────────────────────────────────────────────
      - name: Import VPC
        continue-on-error: true
        working-directory: ${{ env.TF_DIR }}
        run: |
          ID=$(aws ec2 describe-vpcs \
            --filters "Name=cidr,Values=${{ steps.cidr.outputs.vpc_cidr }}" \
                      "Name=isDefault,Values=false" \
            --query 'Vpcs[0].VpcId' --output text)
          [ -n "$ID" ] && [ "$ID" != "None" ] && \
            terraform import -lock=false module.network.aws_vpc.main "$ID" && \
            echo "Imported VPC: $ID"

      # ── Import Public Subnets ────────────────────────────────────────────
      - name: Import public subnets
        continue-on-error: true
        working-directory: ${{ env.TF_DIR }}
        run: |
          VPC=$(aws ec2 describe-vpcs \
            --filters "Name=cidr,Values=${{ steps.cidr.outputs.vpc_cidr }}" \
                      "Name=isDefault,Values=false" \
            --query 'Vpcs[0].VpcId' --output text)
          SUBNETS=($(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$VPC" \
              "Name=cidr-block,Values=${{ steps.cidr.outputs.pub0 }},${{ steps.cidr.outputs.pub1 }}" \
            --query 'Subnets | sort_by(@, &CidrBlock)[].SubnetId' --output text))
          [ -n "${SUBNETS[0]}" ] && \
            terraform import -lock=false 'module.network.aws_subnet.public[0]' "${SUBNETS[0]}"
          [ -n "${SUBNETS[1]}" ] && \
            terraform import -lock=false 'module.network.aws_subnet.public[1]' "${SUBNETS[1]}"

      # ── Import Private Subnets ───────────────────────────────────────────
      - name: Import private subnets
        continue-on-error: true
        working-directory: ${{ env.TF_DIR }}
        run: |
          VPC=$(aws ec2 describe-vpcs \
            --filters "Name=cidr,Values=${{ steps.cidr.outputs.vpc_cidr }}" \
                      "Name=isDefault,Values=false" \
            --query 'Vpcs[0].VpcId' --output text)
          SUBNETS=($(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$VPC" \
              "Name=cidr-block,Values=${{ steps.cidr.outputs.priv0 }},${{ steps.cidr.outputs.priv1 }}" \
            --query 'Subnets | sort_by(@, &CidrBlock)[].SubnetId' --output text))
          [ -n "${SUBNETS[0]}" ] && \
            terraform import -lock=false 'module.network.aws_subnet.private[0]' "${SUBNETS[0]}"
          [ -n "${SUBNETS[1]}" ] && \
            terraform import -lock=false 'module.network.aws_subnet.private[1]' "${SUBNETS[1]}"

      # ── Import Internet Gateway ──────────────────────────────────────────
      - name: Import Internet Gateway
        continue-on-error: true
        working-directory: ${{ env.TF_DIR }}
        run: |
          VPC=$(aws ec2 describe-vpcs \
            --filters "Name=cidr,Values=${{ steps.cidr.outputs.vpc_cidr }}" \
                      "Name=isDefault,Values=false" \
            --query 'Vpcs[0].VpcId' --output text)
          ID=$(aws ec2 describe-internet-gateways \
            --filters "Name=attachment.vpc-id,Values=$VPC" \
            --query 'InternetGateways[0].InternetGatewayId' --output text)
          [ -n "$ID" ] && [ "$ID" != "None" ] && \
            terraform import -lock=false module.network.aws_internet_gateway.main "$ID"

      # ── Import NAT Gateway ───────────────────────────────────────────────
      - name: Import NAT Gateway
        continue-on-error: true
        working-directory: ${{ env.TF_DIR }}
        run: |
          VPC=$(aws ec2 describe-vpcs \
            --filters "Name=cidr,Values=${{ steps.cidr.outputs.vpc_cidr }}" \
                      "Name=isDefault,Values=false" \
            --query 'Vpcs[0].VpcId' --output text)
          ID=$(aws ec2 describe-nat-gateways \
            --filter "Name=vpc-id,Values=$VPC" "Name=state,Values=available" \
            --query 'NatGateways[0].NatGatewayId' --output text)
          [ -n "$ID" ] && [ "$ID" != "None" ] && \
            terraform import -lock=false module.network.aws_nat_gateway.main "$ID"

      # ── Import Elastic IP ────────────────────────────────────────────────
      - name: Import Elastic IP
        continue-on-error: true
        working-directory: ${{ env.TF_DIR }}
        run: |
          VPC=$(aws ec2 describe-vpcs \
            --filters "Name=cidr,Values=${{ steps.cidr.outputs.vpc_cidr }}" \
                      "Name=isDefault,Values=false" \
            --query 'Vpcs[0].VpcId' --output text)
          ID=$(aws ec2 describe-nat-gateways \
            --filter "Name=vpc-id,Values=$VPC" "Name=state,Values=available" \
            --query 'NatGateways[0].NatGatewayAddresses[0].AllocationId' --output text)
          [ -n "$ID" ] && [ "$ID" != "None" ] && \
            terraform import -lock=false module.network.aws_eip.nat "$ID"

      # ── Import Security Groups ───────────────────────────────────────────
      - name: Import Security Groups
        continue-on-error: true
        working-directory: ${{ env.TF_DIR }}
        run: |
          VPC=$(aws ec2 describe-vpcs \
            --filters "Name=cidr,Values=${{ steps.cidr.outputs.vpc_cidr }}" \
                      "Name=isDefault,Values=false" \
            --query 'Vpcs[0].VpcId' --output text)
          ENV="${{ env.ENVIRONMENT }}"
          for TYPE in alb ecs rds; do
            SG=$(aws ec2 describe-security-groups \
              --filters "Name=vpc-id,Values=$VPC" \
                "Name=group-name,Values=sample-app-${ENV}-${TYPE}-sg" \
              --query 'SecurityGroups[0].GroupId' --output text)
            [ -n "$SG" ] && [ "$SG" != "None" ] && \
              terraform import -lock=false "module.security.aws_security_group.${TYPE}" "$SG" && \
              echo "Imported ${TYPE} SG: $SG"
          done

      # ── Import ALB ───────────────────────────────────────────────────────
      - name: Import ALB
        continue-on-error: true
        working-directory: ${{ env.TF_DIR }}
        run: |
          ID=$(aws elbv2 describe-load-balancers \
            --names "sample-app-${{ env.ENVIRONMENT }}-alb" \
            --query 'LoadBalancers[0].LoadBalancerArn' --output text 2>/dev/null)
          [ -n "$ID" ] && [ "$ID" != "None" ] && \
            terraform import -lock=false module.ecs.aws_lb.app "$ID"

      # ── Import ECR ───────────────────────────────────────────────────────
      - name: Import ECR repository
        continue-on-error: true
        working-directory: ${{ env.TF_DIR }}
        run: |
          REPO="sample-app-${{ env.ENVIRONMENT }}-backend"
          aws ecr describe-repositories --repository-names $REPO 2>/dev/null && \
            terraform import -lock=false module.ecs.aws_ecr_repository.backend "$REPO"

      # ── Import ECS Cluster ───────────────────────────────────────────────
      - name: Import ECS cluster
        continue-on-error: true
        working-directory: ${{ env.TF_DIR }}
        run: |
          ID=$(aws ecs describe-clusters \
            --clusters "sample-app-${{ env.ENVIRONMENT }}-cluster" \
            --query 'clusters[0].clusterArn' --output text 2>/dev/null)
          [ -n "$ID" ] && [ "$ID" != "None" ] && \
            terraform import -lock=false module.ecs.aws_ecs_cluster.app "$ID"

      # ── Import IAM Role ──────────────────────────────────────────────────
      - name: Import IAM role
        continue-on-error: true
        working-directory: ${{ env.TF_DIR }}
        run: |
          ROLE="sample-app-${{ env.ENVIRONMENT }}-ecs-task-execution-role"
          aws iam get-role --role-name $ROLE 2>/dev/null && \
            terraform import -lock=false module.ecs.aws_iam_role.ecs_task_execution "$ROLE"

      # ── Import RDS Subnet Group ──────────────────────────────────────────
      - name: Import RDS subnet group
        continue-on-error: true
        working-directory: ${{ env.TF_DIR }}
        run: |
          SG="sample-app-${{ env.ENVIRONMENT }}-db-subnet-group"
          aws rds describe-db-subnet-groups --db-subnet-group-name $SG 2>/dev/null && \
            terraform import -lock=false module.rds.aws_db_subnet_group.main "$SG"

      # ── Import RDS Instance ──────────────────────────────────────────────
      - name: Import RDS instance
        continue-on-error: true
        working-directory: ${{ env.TF_DIR }}
        run: |
          DB="sample-app-${{ env.ENVIRONMENT }}-db"
          aws rds describe-db-instances --db-instance-identifier $DB 2>/dev/null && \
            terraform import -lock=false module.rds.aws_db_instance.default "$DB"

      # ── Import CloudWatch Log Group ──────────────────────────────────────
      - name: Import CloudWatch log group
        continue-on-error: true
        working-directory: ${{ env.TF_DIR }}
        run: |
          LG="/ecs/sample-app-${{ env.ENVIRONMENT }}-backend"
          aws logs describe-log-groups --log-group-name-prefix "$LG" \
            --query 'logGroups[0].logGroupName' --output text 2>/dev/null | \
            grep -q "sample-app" && \
            terraform import -lock=false module.ecs.aws_cloudwatch_log_group.backend "$LG"

      - name: Summary
        run: |
          echo "Import complete for: ${{ env.ENVIRONMENT }}"
          echo "Existing AWS resources are now tracked in Terraform state."
          echo "Run the deploy workflow to apply any remaining changes."
