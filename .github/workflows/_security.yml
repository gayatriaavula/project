name: Security Scans (reusable)

# Called by ci.yml, deploy-dev.yml, deploy-staging.yml, deploy-prod.yml.
# All three Trivy jobs must pass before the caller can proceed to deployment.

on:
  workflow_call:

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  # ── 1. Trivy — Filesystem & Secrets ────────────────────────────────────────
  # Scans source code for hardcoded secrets, CVEs in package manifests,
  # and general misconfigurations. Fails on CRITICAL or HIGH findings.
  trivy-fs:
    name: Trivy — Filesystem & Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          scanners: vuln,secret,misconfig
          skip-dirs: node_modules,.terraform
          trivyignores: .trivyignore

      - name: Upload to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  # ── 2. Trivy — IaC (Terraform) ─────────────────────────────────────────────
  # Detects Terraform misconfigurations: unrestricted ingress, missing
  # encryption, public S3 buckets, over-permissive IAM, etc.
  trivy-iac:
    name: Trivy — IaC (Terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy IaC scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          format: sarif
          output: trivy-iac.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Upload to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

  # ── 3. Trivy — Container Image ─────────────────────────────────────────────
  # Builds the Docker image and scans for OS-level and library CVEs.
  # ignore-unfixed: only fails on CVEs that have an available fix upstream.
  trivy-image:
    name: Trivy — Container Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t scan-target:${{ github.sha }} ./backend

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: image
          image-ref: scan-target:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-container
