name: Bootstrap Terraform State Backend

on:
  workflow_dispatch:

jobs:
  bootstrap:
    name: Create State Bucket and Lock Table
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      BUCKET: ${{ secrets.TF_STATE_BUCKET }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create S3 state bucket
        run: |
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket $BUCKET already exists — skipping creation"
          else
            aws s3 mb "s3://$BUCKET" --region "$AWS_REGION"
            echo "Created bucket: $BUCKET"
          fi

      - name: Enable versioning
        run: |
          aws s3api put-bucket-versioning \
            --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled
          echo "Versioning enabled"

      - name: Enable encryption
        run: |
          aws s3api put-bucket-encryption \
            --bucket "$BUCKET" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          echo "Encryption enabled"

      - name: Block public access on state bucket
        run: |
          aws s3api put-public-access-block \
            --bucket "$BUCKET" \
            --public-access-block-configuration \
            "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          echo "Public access blocked"

      - name: Create DynamoDB lock table
        run: |
          if aws dynamodb describe-table --table-name terraform-state-lock 2>/dev/null; then
            echo "DynamoDB table already exists — skipping creation"
          else
            aws dynamodb create-table \
              --table-name terraform-state-lock \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST
            echo "Created DynamoDB table: terraform-state-lock"
          fi

      - name: Summary
        run: |
          echo "Bootstrap complete!"
          echo ""
          echo "  S3 bucket:      $BUCKET"
          echo "  DynamoDB table: terraform-state-lock"
          echo ""
          echo "You can now push to main (or run the CI/CD workflow manually) to deploy the full stack."
