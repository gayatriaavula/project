name: CI — Lint, Validate & Test

# Runs on every PR. Validates the terraform environment that matches the
# target branch (develop → dev, staging → staging, main → prod).
# No infrastructure is created or changed.

on:
  pull_request:
    branches: [main, staging, develop]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # ── Resolve target environment from PR base branch ────────────────────────
  setup:
    name: Resolve Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      tf_dir:      ${{ steps.resolve.outputs.tf_dir }}
    steps:
      - id: resolve
        run: |
          case "${{ github.base_ref }}" in
            main)
              echo "environment=prod"                          >> $GITHUB_OUTPUT
              echo "tf_dir=terraform/environments/prod"        >> $GITHUB_OUTPUT ;;
            staging)
              echo "environment=staging"                       >> $GITHUB_OUTPUT
              echo "tf_dir=terraform/environments/staging"     >> $GITHUB_OUTPUT ;;
            *)
              echo "environment=dev"                           >> $GITHUB_OUTPUT
              echo "tf_dir=terraform/environments/dev"         >> $GITHUB_OUTPUT ;;
          esac
          echo "PR targets: ${{ github.base_ref }} → ${environment}"

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Run ESLint
        working-directory: backend
        run: npm run lint

  # ── Test ──────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Syntax check
        working-directory: backend
        run: node --check server.js

      - name: Run tests
        working-directory: backend
        run: npm test

  # ── Terraform validate + plan (no apply) ─────────────────────────────────
  terraform-plan:
    name: Terraform Plan (${{ needs.setup.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [setup, lint]
    env:
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Terraform init
        working-directory: ${{ needs.setup.outputs.tf_dir }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        working-directory: ${{ needs.setup.outputs.tf_dir }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ needs.setup.outputs.tf_dir }}
        run: terraform plan -no-color -lock=false -out=tfplan

      - name: Show plan summary on PR
        working-directory: ${{ needs.setup.outputs.tf_dir }}
        run: terraform show -no-color tfplan > plan.txt
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planFile = '${{ needs.setup.outputs.tf_dir }}/plan.txt';
            if (!fs.existsSync(planFile)) process.exit(0);
            const plan = fs.readFileSync(planFile, 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(-60000) : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan — \`${{ needs.setup.outputs.environment }}\`\n\`\`\`hcl\n${truncated}\n\`\`\``
            });
