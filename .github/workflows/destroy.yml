name: Destroy AWS Infrastructure

# Tears down all resources for a chosen environment.
# Defaults to prod — always confirm before running.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy (dev | staging | prod)'
        required: true
        type: choice
        options: [dev, staging, prod]
        default: prod
      confirm:
        description: 'Type the environment name again to confirm destruction'
        required: true
        type: string

jobs:
  destroy:
    name: Destroy (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
      TF_DIR:      terraform/environments/${{ github.event.inputs.environment }}
      AWS_REGION:  ${{ secrets.AWS_REGION }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Confirm destruction
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "${{ github.event.inputs.environment }}" ]; then
            echo "ERROR: Confirmation does not match the environment name. Aborting."
            exit 1
          fi
          echo "Confirmed destruction of: ${{ github.event.inputs.environment }}"

      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Clear stale state lock
        continue-on-error: true
        run: |
          aws s3 rm "s3://${{ secrets.TF_STATE_BUCKET }}/${{ env.ENVIRONMENT }}/terraform.tfstate.tflock" || true

      - name: Terraform destroy
        continue-on-error: true
        working-directory: ${{ env.TF_DIR }}
        run: terraform destroy -auto-approve -lock=false

      - name: Delete ECS services and clusters
        continue-on-error: true
        run: |
          for cluster in $(aws ecs list-clusters \
            --query "clusterArns[?contains(@,'sample-app-${{ env.ENVIRONMENT }}')]" \
            --output text); do
            for service in $(aws ecs list-services --cluster $cluster \
              --query 'serviceArns[]' --output text); do
              aws ecs update-service --cluster $cluster --service $service --desired-count 0
              aws ecs delete-service --cluster $cluster --service $service --force
            done
            aws ecs delete-cluster --cluster $cluster
          done

      - name: Delete ALB listeners, target groups, and load balancers
        continue-on-error: true
        run: |
          for alb in $(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?contains(LoadBalancerName,'sample-app-${{ env.ENVIRONMENT }}')].LoadBalancerArn" \
            --output text); do
            for listener in $(aws elbv2 describe-listeners --load-balancer-arn $alb \
              --query 'Listeners[].ListenerArn' --output text); do
              aws elbv2 delete-listener --listener-arn $listener
            done
            aws elbv2 delete-load-balancer --load-balancer-arn $alb
          done
          echo "Waiting 60s for ALBs to fully delete..."
          sleep 60
          for arn in $(aws elbv2 describe-target-groups \
            --query "TargetGroups[?contains(TargetGroupName,'sample-app-${{ env.ENVIRONMENT }}')].TargetGroupArn" \
            --output text); do
            aws elbv2 delete-target-group --target-group-arn $arn
          done

      - name: Delete RDS instance and subnet group
        continue-on-error: true
        run: |
          DB="sample-app-${{ env.ENVIRONMENT }}-db"
          aws rds describe-db-instances --db-instance-identifier $DB 2>/dev/null && \
            aws rds delete-db-instance --db-instance-identifier $DB \
              --skip-final-snapshot --delete-automated-backups
          echo "Waiting 300s for RDS to delete..."
          sleep 300
          aws rds delete-db-subnet-group \
            --db-subnet-group-name "sample-app-${{ env.ENVIRONMENT }}-db-subnet-group" || true

      - name: Delete ECR repository
        continue-on-error: true
        run: |
          aws ecr delete-repository \
            --repository-name "sample-app-${{ env.ENVIRONMENT }}-backend" \
            --force || true

      - name: Empty and delete S3 frontend bucket
        continue-on-error: true
        run: |
          for bucket in $(aws s3api list-buckets \
            --query "Buckets[?contains(Name,'sample-app-${{ env.ENVIRONMENT }}-frontend')].Name" \
            --output text); do
            aws s3 rm "s3://$bucket" --recursive
            aws s3api delete-bucket --bucket $bucket
            echo "Deleted bucket: $bucket"
          done

      - name: Delete NAT gateways and release EIPs
        continue-on-error: true
        run: |
          VPC=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Environment,Values=${{ env.ENVIRONMENT }}" \
            --query 'Vpcs[0].VpcId' --output text 2>/dev/null)
          if [ -n "$VPC" ] && [ "$VPC" != "None" ]; then
            for natgw in $(aws ec2 describe-nat-gateways \
              --filter "Name=vpc-id,Values=$VPC" "Name=state,Values=available" \
              --query 'NatGateways[].NatGatewayId' --output text); do
              aws ec2 delete-nat-gateway --nat-gateway-id $natgw
            done
            echo "Waiting 60s for NAT gateways..."
            sleep 60
          fi
          for alloc in $(aws ec2 describe-addresses \
            --query 'Addresses[?AssociationId==null].AllocationId' --output text); do
            aws ec2 release-address --allocation-id $alloc
          done

      - name: Delete VPC and networking
        continue-on-error: true
        run: |
          VPC=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Environment,Values=${{ env.ENVIRONMENT }}" \
            --query 'Vpcs[0].VpcId' --output text 2>/dev/null)
          if [ -z "$VPC" ] || [ "$VPC" = "None" ]; then exit 0; fi
          echo "Cleaning VPC: $VPC"
          for subnet in $(aws ec2 describe-subnets \
            --filters Name=vpc-id,Values=$VPC \
            --query 'Subnets[].SubnetId' --output text); do
            aws ec2 delete-subnet --subnet-id $subnet
          done
          for rt in $(aws ec2 describe-route-tables \
            --filters Name=vpc-id,Values=$VPC \
            --query 'RouteTables[?Associations[?Main==`false`]].RouteTableId' \
            --output text); do
            aws ec2 delete-route-table --route-table-id $rt
          done
          for igw in $(aws ec2 describe-internet-gateways \
            --filters Name=attachment.vpc-id,Values=$VPC \
            --query 'InternetGateways[].InternetGatewayId' --output text); do
            aws ec2 detach-internet-gateway --internet-gateway-id $igw --vpc-id $VPC
            aws ec2 delete-internet-gateway --internet-gateway-id $igw
          done
          for sg in $(aws ec2 describe-security-groups \
            --filters Name=vpc-id,Values=$VPC \
            --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text); do
            aws ec2 delete-security-group --group-id $sg || true
          done
          aws ec2 delete-vpc --vpc-id $VPC && echo "Deleted VPC: $VPC"

      - name: Delete CloudWatch log groups
        continue-on-error: true
        run: |
          for lg in $(aws logs describe-log-groups \
            --log-group-name-prefix "/ecs/sample-app-${{ env.ENVIRONMENT }}" \
            --query 'logGroups[].logGroupName' --output text); do
            aws logs delete-log-group --log-group-name $lg
          done

      - name: Delete IAM roles
        continue-on-error: true
        run: |
          for role in $(aws iam list-roles \
            --query "Roles[?contains(RoleName,'sample-app-${{ env.ENVIRONMENT }}')].RoleName" \
            --output text); do
            for policy in $(aws iam list-attached-role-policies --role-name $role \
              --query 'AttachedPolicies[].PolicyArn' --output text); do
              aws iam detach-role-policy --role-name $role --policy-arn $policy
            done
            aws iam delete-role --role-name $role && echo "Deleted: $role"
          done

      - name: Clear Terraform state
        continue-on-error: true
        run: |
          aws s3 rm "s3://${{ secrets.TF_STATE_BUCKET }}/${{ env.ENVIRONMENT }}/terraform.tfstate"       || true
          aws s3 rm "s3://${{ secrets.TF_STATE_BUCKET }}/${{ env.ENVIRONMENT }}/terraform.tfstate.tflock" || true
          echo "Terraform ${{ env.ENVIRONMENT }} state cleared"

      - name: Summary
        run: |
          echo "Destroy complete for: ${{ env.ENVIRONMENT }}"
          echo "All ${{ env.ENVIRONMENT }} AWS resources have been removed."
