name: Trivy — Security Scanning

# Runs automatically on push and PRs.
# Manual trigger: Actions tab → "Trivy — Security Scanning" → Run workflow.
# Weekly schedule: catches new CVEs on unchanged code every Monday 6am UTC.
# Results appear in: github.com/gayatriaavula/project/security/code-scanning

on:
  workflow_dispatch:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]
  schedule:
    - cron: '0 6 * * 1'   # Every Monday 6:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  # ── Scan 1: Filesystem — source code, secrets, npm CVEs ───────────────────
  trivy-fs:
    name: Filesystem & Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy — filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          scanners: vuln,secret,misconfig
          skip-dirs: node_modules,.terraform
          trivyignores: .trivyignore

      - name: Upload results → GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  # ── Scan 2: IaC — Terraform misconfigurations ─────────────────────────────
  trivy-iac:
    name: IaC (Terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy — IaC scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: terraform/
          format: sarif
          output: trivy-iac.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Upload results → GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

  # ── Scan 3: Container image — OS + library CVEs ───────────────────────────
  trivy-image:
    name: Container Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t scan-target:${{ github.sha }} ./backend

      - name: Trivy — image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: scan-target:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload results → GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-container
