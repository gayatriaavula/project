name: Deploy — Staging

# Stages: Lint → Test → Build → SonarCloud → Trivy → Deploy
# Plan runs in parallel from Lint so infrastructure is validated before deploy.

on:
  push:
    branches: [staging]

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  ENVIRONMENT:        staging
  TF_DIR:             terraform/environments/staging
  AWS_REGION:         ${{ secrets.AWS_REGION }}
  TF_VAR_aws_region:  ${{ secrets.AWS_REGION }}
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

jobs:

  # ── Stage 1: Lint ─────────────────────────────────────────────────────────
  lint:
    name: "Stage 1 • Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Run ESLint
        working-directory: backend
        run: npm run lint

  # ── Stage 2: Test ─────────────────────────────────────────────────────────
  test:
    name: "Stage 2 • Test"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Syntax check
        working-directory: backend
        run: node --check server.js
      - name: Run tests
        working-directory: backend
        run: npm test

  # ── Stage 3: Build ────────────────────────────────────────────────────────
  build:
    name: "Stage 3 • Build"
    runs-on: ubuntu-latest
    needs: test
    outputs:
      ecr_url: ${{ steps.push.outputs.ecr_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - name: Build and push Docker image to ECR
        id: push
        run: |
          ECR_URL=$(aws ecr describe-repositories \
            --repository-names "sample-app-${ENVIRONMENT}-backend" \
            --query 'repositories[0].repositoryUri' --output text)
          ECR_REGISTRY=$(echo "$ECR_URL" | cut -d'/' -f1)
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker build -t sample-backend ./backend
          docker tag sample-backend:latest "$ECR_URL:${GITHUB_SHA}"
          docker push "$ECR_URL:${GITHUB_SHA}"
          echo "ecr_url=$ECR_URL" >> $GITHUB_OUTPUT

  # ── Terraform Plan (parallel track) ──────────────────────────────────────
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="encrypt=true"
      - name: Clear stale state lock
        continue-on-error: true
        run: aws s3 rm "s3://${{ secrets.TF_STATE_BUCKET }}/staging/terraform.tfstate.tflock" || true
      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate
      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -no-color -lock=false -out=tfplan
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-staging
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 1

  # ── Stage 4: SonarCloud ───────────────────────────────────────────────────
  sonarcloud:
    name: "Stage 4 • SonarCloud"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Run tests with coverage
        working-directory: backend
        run: npm run test:coverage
      - name: SonarCloud analysis
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}

  # ── Stage 5: Trivy Security Scan ──────────────────────────────────────────
  trivy:
    name: "Stage 5 • Trivy"
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy — Filesystem & Secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          scanners: vuln,secret,misconfig
          skip-dirs: node_modules,.terraform,nginx
          skip-files: docker-compose.yml,.env.example
          trivyignores: .trivyignore

      - name: Upload filesystem results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

      - name: Trivy — IaC (Terraform)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          format: sarif
          output: trivy-iac.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Upload IaC results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

      - name: Configure AWS credentials for ECR pull
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Pull image from ECR
        id: ecr_pull
        run: |
          ECR_URL=$(aws ecr describe-repositories \
            --repository-names "sample-app-${ENVIRONMENT}-backend" \
            --query 'repositories[0].repositoryUri' --output text)
          ECR_REGISTRY=$(echo "$ECR_URL" | cut -d'/' -f1)
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker pull "$ECR_URL:${GITHUB_SHA}"
          echo "image_ref=$ECR_URL:${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Trivy — Container Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ecr_pull.outputs.image_ref }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload image results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-container

  # ── Stage 6: Deploy ───────────────────────────────────────────────────────
  deploy:
    name: "Stage 6 • Deploy"
    runs-on: ubuntu-latest
    needs: [sonarcloud, trivy, plan, build]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="encrypt=true"
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-staging
          path: ${{ env.TF_DIR }}
      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -lock=false tfplan

      - name: Capture Terraform outputs
        id: tf_outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "ecs_cluster=$(terraform output -raw ecs_cluster_name)"         >> $GITHUB_OUTPUT
          echo "ecs_service=$(terraform output -raw ecs_service_name)"         >> $GITHUB_OUTPUT
          echo "backend_url=$(terraform output -raw backend_url)"              >> $GITHUB_OUTPUT
          echo "frontend_bucket=$(terraform output -raw frontend_bucket_name)" >> $GITHUB_OUTPUT
          echo "frontend_url=$(terraform output -raw frontend_url)"            >> $GITHUB_OUTPUT

      - name: Resolve deployment variables
        id: vars
        env:
          TF_ECS_CLUSTER:     ${{ steps.tf_outputs.outputs.ecs_cluster }}
          TF_ECS_SERVICE:     ${{ steps.tf_outputs.outputs.ecs_service }}
          TF_BACKEND_URL:     ${{ steps.tf_outputs.outputs.backend_url }}
          TF_FRONTEND_BUCKET: ${{ steps.tf_outputs.outputs.frontend_bucket }}
          TF_FRONTEND_URL:    ${{ steps.tf_outputs.outputs.frontend_url }}
        run: |
          ECR_URL="${{ needs.build.outputs.ecr_url }}"
          if [ -z "$ECR_URL" ] || [ "$ECR_URL" = "None" ]; then
            ECR_URL=$(aws ecr describe-repositories \
              --repository-names "sample-app-${ENVIRONMENT}-backend" \
              --query 'repositories[0].repositoryUri' --output text)
          fi
          if [ -z "$ECR_URL" ] || [ "$ECR_URL" = "None" ]; then
            echo "ERROR: Could not resolve ECR URL for sample-app-${ENVIRONMENT}-backend" >&2
            exit 1
          fi
          ECS_CLUSTER=${TF_ECS_CLUSTER:-sample-app-${ENVIRONMENT}-cluster}
          ECS_SERVICE=${TF_ECS_SERVICE:-sample-app-${ENVIRONMENT}-backend-service}
          BACKEND_URL=${TF_BACKEND_URL:-$(aws elbv2 describe-load-balancers \
            --names "sample-app-${ENVIRONMENT}-alb" \
            --query 'LoadBalancers[0].DNSName' --output text)}
          FRONTEND_BUCKET=${TF_FRONTEND_BUCKET:-$(aws s3api list-buckets \
            --query "Buckets[?contains(Name,\`sample-app-${ENVIRONMENT}-frontend\`)].Name" \
            --output text | awk '{print $1}')}
          FRONTEND_URL=${TF_FRONTEND_URL:-"http://${FRONTEND_BUCKET}.s3-website-${AWS_REGION}.amazonaws.com"}
          echo "ecr_url=$ECR_URL"                >> $GITHUB_OUTPUT
          echo "ecs_cluster=$ECS_CLUSTER"         >> $GITHUB_OUTPUT
          echo "ecs_service=$ECS_SERVICE"         >> $GITHUB_OUTPUT
          echo "backend_url=$BACKEND_URL"         >> $GITHUB_OUTPUT
          echo "frontend_bucket=$FRONTEND_BUCKET" >> $GITHUB_OUTPUT
          echo "frontend_url=$FRONTEND_URL"       >> $GITHUB_OUTPUT

      - name: Update ECS task definition and deploy
        env:
          ECS_CLUSTER: ${{ steps.vars.outputs.ecs_cluster }}
          ECS_SERVICE:  ${{ steps.vars.outputs.ecs_service }}
          ECR_URL:      ${{ steps.vars.outputs.ecr_url }}
        run: |
          FULL_IMAGE="$ECR_URL:${GITHUB_SHA}"
          TASK_FAMILY=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text | \
            sed 's|.*/||' | cut -d: -f1)
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" --query 'taskDefinition' --output json)
          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$FULL_IMAGE" '
            .containerDefinitions[0].image = $IMAGE |
            del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)')
          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK_ARN"
          MAX_WAIT=1200
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query 'services[0].deployments[?status==`PRIMARY`].rolloutState' \
              --output text)
            echo "Deployment rollout: $STATUS (${ELAPSED}s / ${MAX_WAIT}s)"
            if [ "$STATUS" = "COMPLETED" ]; then echo "Deployment succeeded."; break; fi
            if [ "$STATUS" = "FAILED" ]; then
              echo "Deployment FAILED. Stopped task diagnostics:"
              STOPPED=$(aws ecs list-tasks --cluster "$ECS_CLUSTER" \
                --service-name "$ECS_SERVICE" --desired-status STOPPED \
                --max-items 3 --query 'taskArns[]' --output text)
              [ -n "$STOPPED" ] && aws ecs describe-tasks \
                --cluster "$ECS_CLUSTER" --tasks $STOPPED \
                --query 'tasks[].{stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[].{name:name,reason:reason,exitCode:exitCode}}'
              exit 1
            fi
            sleep 30
            ELAPSED=$((ELAPSED + 30))
          done
          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "Timed out after ${MAX_WAIT}s. Service state:"
            aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query 'services[0].{desired:desiredCount,running:runningCount,pending:pendingCount,deployments:deployments[].{status:status,rollout:rolloutState,desired:desiredCount,running:runningCount,failed:failedTasks}}'
            exit 1
          fi

      - name: Deploy frontend to S3
        env:
          BACKEND_URL:     ${{ steps.vars.outputs.backend_url }}
          FRONTEND_BUCKET: ${{ steps.vars.outputs.frontend_bucket }}
        run: |
          sed -i "s|REPLACE_WITH_BACKEND_API_URL|http://$BACKEND_URL|g" frontend/app.js
          aws s3 sync ./frontend "s3://$FRONTEND_BUCKET" --delete

      - name: Deployment summary
        env:
          FRONTEND_URL: ${{ steps.vars.outputs.frontend_url }}
          BACKEND_URL:  ${{ steps.vars.outputs.backend_url }}
        run: |
          echo "========================================"
          echo "Staging deployment complete!"
          echo "Frontend : $FRONTEND_URL"
          echo "Backend  : http://$BACKEND_URL"
          echo "Image SHA: ${GITHUB_SHA}"
          echo "========================================"
